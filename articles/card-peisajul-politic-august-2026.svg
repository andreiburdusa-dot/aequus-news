  <line x1="0" y1="270" x2="680" y2="270" stroke="#c41e3a" stroke-width="0.5" opacity="0.5"/>
  <line x1="0" y1="405" x2="680" y2="405" stroke="#c41e3a" stroke-width="0.5" opacity="0.5"/>
