<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#1a0a0a"/>

  <text x="40" y="80" font-family="Georgia, 'DejaVu Serif', serif" font-size="15" letter-spacing="2" fill="#c41e3a" font-weight="bold">ROMÂNIA · EDITORIAL</text>

  <line x1="40" y1="104" x2="640" y2="104" stroke="#3a2020" stroke-width="0.5"/>

  <text x="40" y="200" font-family="Georgia, 'DejaVu Serif', serif" font-size="56" fill="#e8e4d8" font-weight="bold">Palma</text>
  <text x="40" y="266" font-family="Georgia, 'DejaVu Serif', serif" font-size="56" fill="#e8e4d8" font-weight="bold">golănească</text>

  <text x="40" y="322" font-family="Georgia, 'DejaVu Serif', serif" font-size="19" fill="#c8c4b8" font-style="italic">Grindeanu i-a dat o palmă lui Fritz prin CCR.</text>

  <line x1="40" y1="360" x2="640" y2="360" stroke="#3a2020" stroke-width="0.5"/>

  <text x="40" y="404" font-family="Georgia, 'DejaVu Serif', serif" font-size="15" fill="#a09880">E o palmă reală. Dar e dată dintr-o poziție strâmbă,</text>
  <text x="40" y="428" font-family="Georgia, 'DejaVu Serif', serif" font-size="15" fill="#a09880">iar loviturile de genul ăsta au obiceiul să se întoarcă.</text>

  <text x="40" y="472" font-family="Georgia, 'DejaVu Serif', serif" font-size="15" fill="#a09880">Pe primar, în orice caz, nu l-a scos din joc.</text>

  <line x1="40" y1="602" x2="640" y2="602" stroke="#3a2020" stroke-width="0.5"/>

  <text x="40" y="640" font-family="Georgia, 'DejaVu Serif', serif" font-size="14" fill="#c41e3a" letter-spacing="1">AEQUUS.NEWS</text>
  <text x="640" y="640" text-anchor="end" font-family="Georgia, 'DejaVu Serif', serif" font-size="14" fill="#a09880">22 august 2026</text>
</svg>
