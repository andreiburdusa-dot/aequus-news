<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#0a0a0f"/>

  <text x="40" y="80" font-family="Georgia, serif" font-size="15" letter-spacing="2" fill="#c41e3a" font-weight="bold">SUA · RUSIA · SANCȚIUNI</text>

  <line x1="40" y1="104" x2="640" y2="104" stroke="#2a2a30" stroke-width="0.5"/>

  <text x="40" y="172" font-family="Georgia, serif" font-size="36" fill="#e8e4d8" font-weight="bold">Tarife de 100%</text>
  <text x="40" y="216" font-family="Georgia, serif" font-size="36" fill="#e8e4d8" font-weight="bold">pentru cumpărătorii</text>
  <text x="40" y="260" font-family="Georgia, serif" font-size="36" fill="#e8e4d8" font-weight="bold">de petrol rusesc</text>

  <text x="40" y="302" font-family="Georgia, serif" font-size="17" fill="#c8c4b8" font-style="italic">Legea ajunge pe biroul lui Trump.</text>

  <line x1="40" y1="340" x2="640" y2="340" stroke="#2a2a30" stroke-width="0.5"/>

  <text x="40" y="376" font-family="Georgia, serif" font-size="15" fill="#a09880">Camera: 262–159 · Senat: 86–11</text>
  <text x="40" y="400" font-family="Georgia, serif" font-size="15" fill="#a09880">China și India, vizate explicit</text>

  <text x="40" y="444" font-family="Georgia, serif" font-size="15" fill="#a09880">Numită în memoria senatorului</text>
  <text x="40" y="468" font-family="Georgia, serif" font-size="15" fill="#a09880">Lindsey Graham, mort în iulie</text>

  <line x1="40" y1="508" x2="640" y2="508" stroke="#2a2a30" stroke-width="0.5"/>

  <text x="40" y="546" font-family="Georgia, serif" font-size="19" fill="#e8e4d8" font-style="italic">Votul contează mai puțin</text>
  <text x="40" y="574" font-family="Georgia, serif" font-size="19" fill="#e8e4d8" font-style="italic">decât ce urmează.</text>

  <line x1="40" y1="614" x2="640" y2="614" stroke="#2a2a30" stroke-width="0.5"/>

  <text x="40" y="650" font-family="Georgia, serif" font-size="14" fill="#c41e3a" letter-spacing="1">AEQUUS.NEWS</text>
  <text x="640" y="650" text-anchor="end" font-family="Georgia, serif" font-size="14" fill="#a09880">17 septembrie 2026</text>
</svg>
