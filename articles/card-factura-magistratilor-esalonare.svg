<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680">
<title>Factura magistraților — actualizare 7 noiembrie — Aequus</title>
<rect width="680" height="680" fill="#0a0a0f"/>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.06"/></pattern></defs>
<rect width="680" height="680" fill="url(#grid)"/>
<rect x="0" y="0" width="5" height="680" fill="#c41e3a"/>
<text x="40" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.22em" opacity="0.5">AEQUUS.NEWS</text>
<text x="640" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#c41e3a" letter-spacing="0.14em" text-anchor="end">ROMÂNIA · BUGET · JUSTIȚIE</text>
<line x1="40" y1="88" x2="640" y2="88" stroke="#1e1e2e" stroke-width="0.8"/>
<rect x="40" y="108" width="118" height="22" rx="2" fill="rgba(196,30,58,0.15)"/>
<rect x="40" y="108" width="3" height="22" fill="#c41e3a"/>
<text x="52" y="123" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#c41e3a" letter-spacing="0.16em">ACTUALIZARE</text>
<text x="40" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#e8e8f0" letter-spacing="-0.01em">Guvernul propune rate.</text>
<text x="40" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" font-style="italic" fill="#c41e3a" letter-spacing="-0.01em">Creditorul laudă tonul.</text>
<text x="40" y="302" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c8c4b8">Savonea: „o schimbare binevenită față de Guvernul anterior”.</text>
<text x="40" y="326" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c8c4b8">Suma, calendarul și penalitățile: nespuse.</text>
<line x1="40" y1="372" x2="640" y2="372" stroke="#1e1e2e" stroke-width="0.8"/>
<text x="40" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="800" fill="#e8e8f0">5 mld. lei</text>
<text x="40" y="468" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c41e3a" letter-spacing="0.14em">DOSARUL CÂȘTIGAT DE ÎCCJ</text>
<text x="350" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="800" fill="#e8e8f0">12,79</text>
<text x="350" y="468" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c41e3a" letter-spacing="0.14em">MLD. TOTAL, DUPĂ SURSE</text>
<text x="40" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="800" fill="#e8e8f0">peste 21%</text>
<text x="40" y="568" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c41e3a" letter-spacing="0.14em">PE AN, PENALITĂȚI ȘI DOBÂNZI (ÎCCJ)</text>
<text x="350" y="540" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="800" fill="#e8e8f0">0</text>
<text x="350" y="568" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c41e3a" letter-spacing="0.14em">RATE ȘI TERMENE ANUNȚATE</text>
<line x1="0" y1="660" x2="680" y2="660" stroke="#1e1e2e" stroke-width="0.5"/>
<text x="40" y="650" font-family="Arial, sans-serif" font-size="12" fill="#a09880" letter-spacing="0.08em">7 NOIEMBRIE 2026</text>
<text x="640" y="650" font-family="Arial, sans-serif" font-size="11" fill="#a09880" text-anchor="end">5 sau 13 miliarde? Factura magistraților</text>
</svg>
