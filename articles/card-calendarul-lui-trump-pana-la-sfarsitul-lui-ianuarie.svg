<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680">
<title>Până la sfârșitul lui ianuarie — Aequus</title>
<rect width="680" height="680" fill="#0a0a0f"/>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.06"/></pattern></defs>
<rect width="680" height="680" fill="url(#grid)"/>
<rect x="0" y="0" width="5" height="680" fill="#c41e3a"/>
<text x="40" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.22em" opacity="0.5">AEQUUS.NEWS</text>
<text x="640" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#c41e3a" letter-spacing="0.14em" text-anchor="end">SUA · IRAN · EUROPA</text>
<line x1="40" y1="88" x2="640" y2="88" stroke="#1e1e2e" stroke-width="0.8"/>
<rect x="40" y="108" width="150" height="22" rx="2" fill="rgba(196,30,58,0.15)"/>
<rect x="40" y="108" width="3" height="22" fill="#c41e3a"/>
<text x="52" y="123" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#c41e3a" letter-spacing="0.16em">ARTICOL DE FOND</text>
<text x="40" y="192" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#e8e8f0" letter-spacing="-0.01em">Până la sfârșitul</text>
<text x="40" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#e8e8f0" letter-spacing="-0.01em">lui ianuarie.</text>
<text x="40" y="290" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" font-style="italic" fill="#c41e3a" letter-spacing="-0.01em">Calendarul lui Trump.</text>
<text x="40" y="330" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c8c4b8">Banii războiului, Congresul, tarifele, trupele. Dată cu dată.</text>
<line x1="40" y1="364" x2="640" y2="364" stroke="#1e1e2e" stroke-width="0.8"/>
<text x="40" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="800" fill="#e8e8f0">11 dec.</text>
<text x="40" y="458" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c41e3a" letter-spacing="0.14em">EXPIRĂ FINANȚAREA</text>
<text x="250" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="800" fill="#e8e8f0">3 ian.</text>
<text x="250" y="458" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c41e3a" letter-spacing="0.14em">CONGRESUL DEMOCRAT</text>
<text x="460" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="800" fill="#e8e8f0">25 ian.</text>
<text x="460" y="458" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c41e3a" letter-spacing="0.14em">TARIFELE PENTRU UE</text>
<text x="40" y="532" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#e8e8f0">„Up until really the end of January,</text>
<text x="40" y="560" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#e8e8f0">pretty much, you know, we're funded.”</text>
<text x="40" y="590" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c41e3a" letter-spacing="0.14em">TRUMP, DESPRE RĂZBOIUL CU IRANUL (NEW YORK POST)</text>
<line x1="0" y1="660" x2="680" y2="660" stroke="#1e1e2e" stroke-width="0.5"/>
<text x="40" y="650" font-family="Arial, sans-serif" font-size="12" fill="#a09880" letter-spacing="0.08em">28 NOIEMBRIE 2026</text>
<text x="640" y="650" font-family="Arial, sans-serif" font-size="11" fill="#a09880" text-anchor="end">Calendarul lui Trump</text>
</svg>
