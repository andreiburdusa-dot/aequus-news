<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#1a0a0a"/>

  <text x="40" y="80" font-family="Georgia, serif" font-size="15" letter-spacing="2" fill="#c41e3a" font-weight="bold">SERIA CAPTURAREA · ROMÂNIA</text>

  <line x1="40" y1="104" x2="640" y2="104" stroke="#3a2020" stroke-width="0.5"/>

  <text x="40" y="180" font-family="Georgia, serif" font-size="44" fill="#e8e4d8" font-weight="bold">Balaurul cu</text>
  <text x="40" y="232" font-family="Georgia, serif" font-size="44" fill="#e8e4d8" font-weight="bold">două capete</text>

  <text x="40" y="278" font-family="Georgia, serif" font-size="18" fill="#c8c4b8" font-style="italic">Piața Victoriei, 15 septembrie:</text>
  <text x="40" y="304" font-family="Georgia, serif" font-size="18" fill="#c8c4b8" font-style="italic">protest confiscat, ofertă politică refuzată.</text>

  <line x1="40" y1="342" x2="640" y2="342" stroke="#3a2020" stroke-width="0.5"/>

  <text x="40" y="378" font-family="Georgia, serif" font-size="15" fill="#a09880">Stradă: „Am venit să ne batem."</text>
  <text x="40" y="402" font-family="Georgia, serif" font-size="15" fill="#a09880">Culise: „modelul suedez", respins.</text>

  <text x="40" y="446" font-family="Georgia, serif" font-size="15" fill="#a09880">Tiparul Simion: mereu „pașnic",</text>
  <text x="40" y="470" font-family="Georgia, serif" font-size="15" fill="#a09880">niciodată răspunderea.</text>

  <line x1="40" y1="510" x2="640" y2="510" stroke="#3a2020" stroke-width="0.5"/>

  <text x="40" y="548" font-family="Georgia, serif" font-size="19" fill="#e8e4d8" font-style="italic">De ce nu mai funcționează</text>
  <text x="40" y="576" font-family="Georgia, serif" font-size="19" fill="#e8e4d8" font-style="italic">a doua Mineriadă.</text>

  <line x1="40" y1="614" x2="640" y2="614" stroke="#3a2020" stroke-width="0.5"/>

  <text x="40" y="650" font-family="Georgia, serif" font-size="14" fill="#c41e3a" letter-spacing="1">AEQUUS.NEWS</text>
  <text x="640" y="650" text-anchor="end" font-family="Georgia, serif" font-size="14" fill="#a09880">16 septembrie 2026</text>
</svg>
