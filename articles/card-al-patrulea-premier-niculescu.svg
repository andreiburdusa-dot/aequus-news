<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680">
<title>Al patrulea premier — Aequus</title>
<rect width="680" height="680" fill="#0a0a0f"/>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.06"/></pattern></defs>
<rect width="680" height="680" fill="url(#grid)"/>
<rect x="0" y="0" width="5" height="680" fill="#c41e3a"/>
<text x="40" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.22em" opacity="0.5">AEQUUS.NEWS</text>
<text x="640" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#c41e3a" letter-spacing="0.14em" text-anchor="end">ROMÂNIA</text>
<line x1="40" y1="88" x2="640" y2="88" stroke="#1e1e2e" stroke-width="0.8"/>
<rect x="40" y="108" width="80" height="22" rx="2" fill="rgba(196,30,58,0.15)"/>
<rect x="40" y="108" width="3" height="22" fill="#c41e3a"/>
<text x="52" y="123" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#c41e3a" letter-spacing="0.16em">ANALIZĂ</text>
<text x="40" y="200" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" fill="#e8e8f0" letter-spacing="-0.01em">Al patrulea</text>
<text x="40" y="264" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" font-style="italic" fill="#c41e3a" letter-spacing="-0.01em">premier</text>
<text x="40" y="310" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c8c4b8">Ce a arătat desemnarea lui Luca Niculescu</text>
<text x="40" y="334" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c8c4b8">și de ce anticipatele rămân în sertar</text>
<line x1="40" y1="372" x2="640" y2="372" stroke="#1e1e2e" stroke-width="0.8"/>
<text x="40" y="490" font-family="Georgia, 'Times New Roman', serif" font-size="120" font-weight="800" fill="#e8e8f0">182/233</text>
<text x="40" y="530" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#c41e3a" letter-spacing="0.18em">PLAFONUL UNUI GUVERN FĂRĂ PSD</text>
<text x="40" y="576" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#c8c4b8">Fiecare desemnare fără majoritate mută criza</text>
<text x="40" y="600" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#c8c4b8">de la Cotroceni spre Parlament.</text>
<line x1="0" y1="660" x2="680" y2="660" stroke="#1e1e2e" stroke-width="0.5"/>
<text x="40" y="650" font-family="Arial, sans-serif" font-size="12" fill="#a09880" letter-spacing="0.08em">6 OCTOMBRIE 2026</text>
</svg>
