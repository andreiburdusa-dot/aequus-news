<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680">
<title>De la Oslo la Sankt Petersburg — Aequus</title>
<rect width="680" height="680" fill="#1a0a0a"/>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.06"/></pattern></defs>
<rect width="680" height="680" fill="url(#grid)"/>
<rect x="0" y="0" width="5" height="680" fill="#c41e3a"/>
<text x="40" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.22em" opacity="0.5">AEQUUS.NEWS</text>
<text x="640" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#c41e3a" letter-spacing="0.14em" text-anchor="end">GLOBAL · ROMÂNIA</text>
<line x1="40" y1="88" x2="640" y2="88" stroke="#2e1e1e" stroke-width="0.8"/>
<rect x="40" y="108" width="80" height="22" rx="2" fill="rgba(196,30,58,0.15)"/>
<rect x="40" y="108" width="3" height="22" fill="#c41e3a"/>
<text x="52" y="123" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#c41e3a" letter-spacing="0.16em">ANALIZĂ</text>
<text x="40" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#e8e8f0" letter-spacing="-0.01em">De la Oslo</text>
<text x="40" y="256" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" font-style="italic" fill="#c41e3a" letter-spacing="-0.01em">la Sankt Petersburg</text>
<text x="40" y="304" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c8c4b8">„O nouă arhitectură de securitate între Rusia</text>
<text x="40" y="328" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c8c4b8">și Europa”, pe masa negocierilor.</text>
<line x1="40" y1="368" x2="640" y2="368" stroke="#2e1e1e" stroke-width="0.8"/>
<text x="40" y="480" font-family="Georgia, 'Times New Roman', serif" font-size="110" font-weight="800" fill="#e8e8f0">10 nov.</text>
<text x="40" y="522" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" fill="#c41e3a" letter-spacing="0.18em">ÎN JURUL ACESTEI DATE: NEGOCIERI RUSIA–SUA–UCRAINA</text>
<text x="40" y="570" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#c8c4b8">România nu a fost nici la Oslo, nici la Sankt Petersburg.</text>
<text x="40" y="594" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#c8c4b8">Care este poziția ei?</text>
<line x1="0" y1="660" x2="680" y2="660" stroke="#2e1e1e" stroke-width="0.5"/>
<text x="40" y="650" font-family="Arial, sans-serif" font-size="12" fill="#a09880" letter-spacing="0.08em">22 OCTOMBRIE 2026</text>
</svg>
