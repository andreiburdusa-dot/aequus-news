<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680">
<title>„A făcut o glumă” — Aequus</title>
<rect width="680" height="680" fill="#0a0a0f"/>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.06"/></pattern></defs>
<rect width="680" height="680" fill="url(#grid)"/>
<rect x="0" y="0" width="5" height="680" fill="#c41e3a"/>
<text x="40" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.22em" opacity="0.5">AEQUUS.NEWS</text>
<text x="640" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#c41e3a" letter-spacing="0.14em" text-anchor="end">ROMÂNIA · PREȘEDINȚIA · SUA</text>
<line x1="40" y1="88" x2="640" y2="88" stroke="#1e1e2e" stroke-width="0.8"/>
<rect x="40" y="108" width="86" height="22" rx="2" fill="rgba(196,30,58,0.15)"/>
<rect x="40" y="108" width="3" height="22" fill="#c41e3a"/>
<text x="52" y="123" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#c41e3a" letter-spacing="0.16em">ANALIZĂ</text>
<text x="40" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" fill="#e8e8f0" letter-spacing="-0.01em">„A făcut</text>
<text x="40" y="254" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700" font-style="italic" fill="#c41e3a" letter-spacing="-0.01em">o glumă.”</text>
<text x="40" y="300" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c8c4b8">Cum minimizează Cotroceni ce nu vrea să explice.</text>
<line x1="40" y1="340" x2="640" y2="340" stroke="#1e1e2e" stroke-width="0.8"/>
<text x="40" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#e8e8f0">Ambasadoarea care vorbea de căderea guvernului:</text>
<text x="40" y="410" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#c41e3a">„a glumit”. Casa Albă a scos-o din post.</text>
<text x="40" y="450" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#e8e8f0">Consilierul de la masa cu ea:</text>
<text x="40" y="476" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#c41e3a">„persoană fizică”.</text>
<text x="40" y="516" font-family="Georgia, 'Times New Roman', serif" font-size="19" fill="#e8e8f0">Șeful SPP la cina cu politicieni:</text>
<text x="40" y="542" font-family="Georgia, 'Times New Roman', serif" font-size="19" font-style="italic" fill="#c41e3a">„credeți că e relevant?”</text>
<text x="40" y="584" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#a09880" letter-spacing="0.14em">NICUȘOR DAN, 10 NOIEMBRIE</text>
<line x1="0" y1="660" x2="680" y2="660" stroke="#1e1e2e" stroke-width="0.5"/>
<text x="40" y="650" font-family="Arial, sans-serif" font-size="12" fill="#a09880" letter-spacing="0.08em">11 NOIEMBRIE 2026</text>
<text x="640" y="650" font-family="Arial, sans-serif" font-size="11" fill="#a09880" text-anchor="end">Două seri, patru episoade</text>
</svg>
