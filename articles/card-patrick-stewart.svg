<svg viewBox="0 0 680 680" width="680" height="680" xmlns="http://www.w3.org/2000/svg">
  <rect width="680" height="680" fill="#0a0a0f"/>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#14141f" stroke-width="0.5"/>
    </pattern>
  </defs>
  <rect width="680" height="680" fill="url(#grid)"/>
  <rect x="0" y="0" width="680" height="3" fill="#4a6fa5"/>

  <text x="48" y="58" font-family="Georgia, serif" font-size="13" fill="#4a6fa5" letter-spacing="3">AEQUUS.NEWS</text>
  <line x1="0" y1="72" x2="680" y2="72" stroke="#1e1e2e" stroke-width="0.5"/>

  <text x="48" y="106" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" fill="#555568" letter-spacing="2">CULTURĂ · IN MEMORIAM</text>
  <line x1="0" y1="122" x2="680" y2="122" stroke="#1e1e2e" stroke-width="0.5"/>

  <text x="48" y="188" font-family="Georgia, serif" font-size="44" fill="#e8e8f0">Patrick Stewart</text>
  <text x="48" y="228" font-family="Georgia, serif" font-size="22" fill="#4a6fa5" letter-spacing="2">1940 – 2026</text>
  <text x="48" y="266" font-family="Georgia, serif" font-size="19" fill="#8888a0" font-style="italic">actorul care a dus Shakespeare</text>
  <text x="48" y="292" font-family="Georgia, serif" font-size="19" fill="#8888a0" font-style="italic">pe puntea Enterprise</text>

  <line x1="0" y1="326" x2="680" y2="326" stroke="#1e1e2e" stroke-width="0.5"/>

  <text x="48" y="366" font-family="Georgia, serif" font-size="15" fill="#9090a8">A murit pe 28 octombrie, acasă, la Los Angeles,</text>
  <text x="48" y="392" font-family="Georgia, serif" font-size="15" fill="#9090a8">la 86 de ani, în grija soției sale.</text>

  <rect x="48" y="428" width="2" height="62" fill="#4a6fa5"/>
  <text x="64" y="454" font-family="Georgia, serif" font-size="22" fill="#a0a0bc" font-style="italic">„Make it so.”</text>
  <text x="64" y="480" font-family="Georgia, serif" font-size="13" fill="#6a6a84">comanda lui Picard, titlul memoriilor sale</text>

  <line x1="0" y1="520" x2="680" y2="520" stroke="#1e1e2e" stroke-width="0.5"/>

  <text x="48" y="558" font-family="Georgia, serif" font-size="15" fill="#9090a8">Royal Shakespeare Company · două premii Olivier</text>
  <text x="48" y="584" font-family="Georgia, serif" font-size="15" fill="#9090a8">Jean-Luc Picard · Profesorul X</text>

  <line x1="0" y1="630" x2="680" y2="630" stroke="#1e1e2e" stroke-width="0.5"/>
  <text x="48" y="662" font-family="Georgia, serif" font-size="14" fill="#4a6fa5" letter-spacing="1">AEQUUS.NEWS</text>
  <text x="640" y="662" text-anchor="end" font-family="Georgia, serif" font-size="14" fill="#a09880">30 octombrie 2026</text>
</svg>
