<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680">
<title>Ce s-a mai întâmplat azi — Aequus</title>
<rect width="680" height="680" fill="#0a0a0f"/>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.06"/></pattern></defs>
<rect width="680" height="680" fill="url(#grid)"/>
<rect x="0" y="0" width="5" height="680" fill="#c41e3a"/>
<text x="40" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.22em" opacity="0.5">AEQUUS.NEWS</text>
<circle cx="497" cy="67" r="5" fill="#c41e3a"/>
<text x="640" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="800" fill="#c41e3a" letter-spacing="0.16em" text-anchor="end">ÎN DESFĂȘURARE</text>
<line x1="40" y1="88" x2="640" y2="88" stroke="#1e1e2e" stroke-width="0.8"/>
<text x="40" y="146" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" font-style="italic" fill="#c41e3a">Ce s-a mai întâmplat azi</text>
<text x="40" y="214" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#c41e3a" letter-spacing="0.12em">25 NOV.</text>
<text x="128" y="214" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#e8e8f0">Muniție da, război nu</text>
<text x="128" y="244" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c8c4b8">Liderii republicani din Senat, deschiși la tăierea</text>
<text x="128" y="266" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c8c4b8">banilor pentru ofensiva din Iran. Termenul: 11 decembrie.</text>
<line x1="40" y1="296" x2="640" y2="296" stroke="#1e1e2e" stroke-width="0.8"/>
<text x="40" y="344" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#c41e3a" letter-spacing="0.12em">25 NOV.</text>
<text x="128" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#e8e8f0">Ormuz: traficul, −40%</text>
<text x="128" y="374" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c8c4b8">125 de nave în 17–23 noiembrie, față de 226 în 1–7 noiembrie.</text>
<text x="128" y="396" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c8c4b8">Iranul: alte două petroliere au lovit mine (neconfirmat).</text>
<line x1="40" y1="426" x2="640" y2="426" stroke="#1e1e2e" stroke-width="0.8"/>
<text x="40" y="474" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#c41e3a" letter-spacing="0.12em">25 NOV.</text>
<text x="128" y="474" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="700" fill="#e8e8f0">Kremlinul: niciun document</text>
<text x="128" y="504" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c8c4b8">Peskov: Putin nu le-a înmânat lui Trump și lui Xi</text>
<text x="128" y="526" font-family="'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#c8c4b8">niciun document despre încheierea războiului.</text>
<line x1="0" y1="660" x2="680" y2="660" stroke="#1e1e2e" stroke-width="0.5"/>
<text x="40" y="650" font-family="Arial, sans-serif" font-size="12" fill="#a09880" letter-spacing="0.08em">25 NOIEMBRIE 2026 · TOATE ACTUALIZĂRILE PE AEQUUS.NEWS</text>
</svg>
