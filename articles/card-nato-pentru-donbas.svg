<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680">
<title>NATO în schimbul Donbasului — Aequus</title>
<rect width="680" height="680" fill="#1a0a0a"/>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.06"/></pattern></defs>
<rect width="680" height="680" fill="url(#grid)"/>
<rect x="0" y="0" width="5" height="680" fill="#c41e3a"/>
<text x="40" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.22em" opacity="0.5">AEQUUS.NEWS</text>
<text x="640" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#c41e3a" letter-spacing="0.14em" text-anchor="end">UCRAINA · NATO · ROMÂNIA</text>
<line x1="40" y1="88" x2="640" y2="88" stroke="#2e1e1e" stroke-width="0.8"/>
<rect x="40" y="108" width="230" height="22" rx="2" fill="rgba(196,30,58,0.15)"/>
<rect x="40" y="108" width="3" height="22" fill="#c41e3a"/>
<text x="52" y="123" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#c41e3a" letter-spacing="0.16em">WALL STREET JOURNAL, 19 NOV.</text>
<text x="40" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#e8e8f0" letter-spacing="-0.01em">NATO în schimbul</text>
<text x="40" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" font-style="italic" fill="#c41e3a" letter-spacing="-0.01em">Donbasului?</text>
<text x="40" y="290" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c8c4b8">Emisarii lui Trump au pus întrebarea. Moscova</text>
<text x="40" y="314" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c8c4b8">cere, în schimb, NATO la nivelul din 1997.</text>
<line x1="40" y1="348" x2="640" y2="348" stroke="#2e1e1e" stroke-width="0.8"/>
<text x="40" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#e8e8f0">„…the irrevocable nature of our demand</text>
<text x="40" y="422" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#e8e8f0">that this state must not join NATO.”</text>
<text x="40" y="444" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c41e3a" letter-spacing="0.14em">SERGHEI RIABKOV, 20 NOIEMBRIE (INTERFAX)</text>
<text x="40" y="496" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#e8e8f0">Aderarea cere 32 de voturi.</text>
<text x="40" y="524" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#e8e8f0">Unul e al României. Bucureștiul tace.</text>
<text x="40" y="546" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c41e3a" letter-spacing="0.14em">ROMÂNIA A INTRAT ÎN NATO ÎN 2004</text>
<line x1="0" y1="660" x2="680" y2="660" stroke="#2e1e1e" stroke-width="0.5"/>
<text x="40" y="640" font-family="Arial, sans-serif" font-size="12" fill="#a09880" letter-spacing="0.08em">22 NOIEMBRIE 2026</text>
<text x="640" y="640" font-family="Arial, sans-serif" font-size="11" fill="#a09880" text-anchor="end">NATO în schimbul Donbasului</text>
</svg>
