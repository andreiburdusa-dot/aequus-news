<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <!-- Dark background -->
  <rect width="680" height="680" fill="#0a0a1a"/>
  
  <!-- Top zone: Title area -->
  <rect x="0" y="0" width="680" height="150" fill="#0a0a1a"/>
  <line x1="0" y1="150" x2="680" y2="150" stroke="#c41e3a" stroke-width="0.5"/>
  
  <!-- Red accent line at very top -->
  <line x1="0" y1="10" x2="680" y2="10" stroke="#c41e3a" stroke-width="2"/>
  
  <!-- Title text -->
  <text x="40" y="65" font-family="Georgia, serif" font-size="32" font-weight="600" fill="#e8e4d8" letter-spacing="-0.5">Matematică</text>
  <text x="40" y="100" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#c41e3a" letter-spacing="0.5">îngroapă România</text>
  
  <!-- Zone 2: Subtitle -->
  <rect x="0" y="150" width="680" height="135" fill="#0a0a1a"/>
  <line x1="0" y1="285" x2="680" y2="285" stroke="#c41e3a" stroke-width="0.5"/>
  
  <text x="40" y="185" font-family="Georgia, serif" font-size="16" fill="#c8c4b8" font-style="italic">26 august 2026: ziua când România a renunțat</text>
  <text x="40" y="215" font-family="Georgia, serif" font-size="15" fill="#a09880">800 de milioane de euro. ND zice:</text>
  <text x="40" y="240" font-family="Georgia, serif" font-size="15" fill="#a09880">"am asumat împreună."</text>
  <text x="40" y="265" font-family="Georgia, serif" font-size="13" fill="#7a7670" letter-spacing="1">SERIA CAPTURAREA XXXVII</text>
  
  <!-- Zone 3: Key insight -->
  <rect x="0" y="285" width="680" height="115" fill="#0a0a1a"/>
  <line x1="0" y1="400" x2="680" y2="400" stroke="#c41e3a" stroke-width="0.5"/>
  
  <text x="40" y="320" font-family="Georgia, serif" font-size="15" fill="#e8e4d8" font-weight="600">Ce s-a pierdut</text>
  <text x="40" y="350" font-family="Georgia, serif" font-size="14" fill="#c8c4b8">100 km autostradă SAU 5 spitale regionale</text>
  <text x="40" y="372" font-family="Georgia, serif" font-size="14" fill="#c8c4b8">SAU 200 de școli noi SAU modernizare Otopeni</text>
  <text x="40" y="390" font-family="Georgia, serif" font-size="13" fill="#a09880" font-style="italic">CTP: "Măscărici al valorilor europene"</text>
  
  <!-- Zone 4: Analysis -->
  <rect x="0" y="400" width="680" height="115" fill="#0a0a1a"/>
  <line x1="0" y1="515" x2="680" y2="515" stroke="#c41e3a" stroke-width="0.5"/>
  
  <text x="40" y="435" font-family="Georgia, serif" font-size="15" fill="#e8e4d8" font-weight="600">Răspunderea</text>
  <text x="40" y="465" font-family="Georgia, serif" font-size="14" fill="#c8c4b8">PSD: sabotaj deliberat. Bolojan: confirmare.</text>
  <text x="40" y="488" font-family="Georgia, serif" font-size="14" fill="#c8c4b8">ND: inactivitate deliberată + spălarea pe mâini.</text>
  <text x="40" y="510" font-family="Georgia, serif" font-size="13" fill="#a09880">Cojocari: fotografii din spitalul Grigore Alexandrescu.</text>
  
  <!-- Zone 5: Bottom - Call to action -->
  <rect x="0" y="515" width="680" height="165" fill="#0a0a1a"/>
  
  <text x="40" y="550" font-family="Georgia, serif" font-size="15" fill="#e8e4d8" font-weight="600">Ecuația lui ND</text>
  <text x="40" y="580" font-family="Georgia, serif" font-size="13" fill="#c8c4b8">ND (inactiv) + PSD (saboteur) + România (pierde)</text>
  <text x="40" y="602" font-family="Georgia, serif" font-size="13" fill="#c8c4b8">= "am asumat împreună" (evitare răspunderii)</text>
  
  <text x="40" y="640" font-family="Georgia, serif" font-size="14" fill="#c41e3a" font-weight="600">aequus.news</text>
  <text x="40" y="665" font-family="Georgia, serif" font-size="12" fill="#7a7670">Analiza geopolitică. Rece. Fără ira.</text>
  
  <!-- Decorative elements: red dots at corners -->
  <circle cx="30" cy="30" r="3" fill="#c41e3a" opacity="0.6"/>
  <circle cx="650" cy="650" r="3" fill="#c41e3a" opacity="0.6"/>
</svg>