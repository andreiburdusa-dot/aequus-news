<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 680" width="680" height="680">
<title>O antenă radar în Kuweit — Aequus</title>
<rect width="680" height="680" fill="#1a0a0a"/>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.15" opacity="0.06"/></pattern></defs>
<rect width="680" height="680" fill="url(#grid)"/>
<rect x="0" y="0" width="5" height="680" fill="#c41e3a"/>
<text x="40" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="0.22em" opacity="0.5">AEQUUS.NEWS</text>
<text x="640" y="72" font-family="'Helvetica Neue', Arial, sans-serif" font-size="10" font-weight="700" fill="#c41e3a" letter-spacing="0.14em" text-anchor="end">IRAN · GOLFUL · EUROPA</text>
<line x1="40" y1="88" x2="640" y2="88" stroke="#2e1e1e" stroke-width="0.8"/>
<rect x="40" y="108" width="176" height="22" rx="2" fill="rgba(196,30,58,0.15)"/>
<rect x="40" y="108" width="3" height="22" fill="#c41e3a"/>
<text x="52" y="123" font-family="'Helvetica Neue', Arial, sans-serif" font-size="9" font-weight="700" fill="#c41e3a" letter-spacing="0.16em">VERIFICAT LA SURSĂ</text>
<text x="40" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#e8e8f0" letter-spacing="-0.01em">O antenă radar.</text>
<text x="40" y="254" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" font-style="italic" fill="#c41e3a" letter-spacing="-0.01em">Doi italieni uciși.</text>
<text x="40" y="300" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c8c4b8">Kuweit, 26 noiembrie: resturi de drone interceptate. Kuweitul</text>
<text x="40" y="324" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#c8c4b8">și Roma acuză Iranul. Teheranul neagă, propune o anchetă comună.</text>
<line x1="40" y1="372" x2="640" y2="372" stroke="#2e1e1e" stroke-width="0.8"/>
<text x="40" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="800" fill="#e8e8f0">2</text>
<text x="40" y="468" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c41e3a" letter-spacing="0.14em">TEHNICIENI RHEINMETALL ITALIA</text>
<text x="370" y="440" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="800" fill="#e8e8f0">~96 $</text>
<text x="370" y="468" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c41e3a" letter-spacing="0.14em">BRENTUL, JOI SEARA</text>
<text x="40" y="536" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#e8e8f0">„We must step up pressure on Iran…”</text>
<text x="40" y="564" font-family="'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="700" fill="#c41e3a" letter-spacing="0.14em">URSULA VON DER LEYEN, 26 NOIEMBRIE</text>
<text x="40" y="598" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#a09880">Trump, aceeași zi: „We have victory at hand.”</text>
<line x1="0" y1="660" x2="680" y2="660" stroke="#2e1e1e" stroke-width="0.5"/>
<text x="40" y="650" font-family="Arial, sans-serif" font-size="12" fill="#a09880" letter-spacing="0.08em">27 NOIEMBRIE 2026</text>
<text x="640" y="650" font-family="Arial, sans-serif" font-size="11" fill="#a09880" text-anchor="end">O antenă radar în Kuweit</text>
</svg>
