<svg viewBox="0 0 680 680" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a0a0f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="680" height="680" fill="url(#bgGradient)"/>
  
  <!-- Top accent line -->
  <line x1="0" y1="0" x2="680" y2="0" stroke="#c41e3a" stroke-width="3"/>
  
  <!-- Decorative corner -->
  <rect x="30" y="30" width="2" height="40" fill="#c41e3a"/>
  <rect x="30" y="30" width="40" height="2" fill="#c41e3a"/>
  
  <!-- Main title -->
  <text x="340" y="120" font-family="Georgia, serif" font-size="48" font-weight="700" text-anchor="middle" fill="#ffffff" letter-spacing="-1">
    JALONUL
  </text>
  <text x="340" y="175" font-family="Georgia, serif" font-size="52" font-weight="700" text-anchor="middle" fill="#c41e3a" letter-spacing="-1">
    770
  </text>
  
  <!-- Separator -->
  <line x1="100" y1="210" x2="580" y2="210" stroke="#c41e3a" stroke-width="1" opacity="0.5"/>
  
  <!-- Subtitle -->
  <text x="340" y="270" font-family="Georgia, serif" font-size="20" text-anchor="middle" fill="#d4cfc0" font-style="italic">
    Două lame
  </text>
  <text x="340" y="300" font-family="Georgia, serif" font-size="20" text-anchor="middle" fill="#d4cfc0" font-style="italic">
    o lege
  </text>
  
  <!-- Central visual concept: two blades -->
  <g transform="translate(340, 390)">
    <!-- Blade 1 (visible) - pointing up-left -->
    <path d="M 0 0 L -60 -80 L -40 -90 L 20 -10 Z" fill="#c41e3a" opacity="0.8"/>
    <text x="-50" y="-50" font-family="Georgia, serif" font-size="11" fill="#ffffff" font-weight="600" text-anchor="middle">FRITZ</text>
    
    <!-- Blade 2 (hidden) - pointing down-right -->
    <path d="M 0 0 L 60 80 L 50 95 L -10 15 Z" fill="#c41e3a" opacity="0.4"/>
    <text x="45" y="60" font-family="Georgia, serif" font-size="11" fill="#e8e4d8" font-weight="600" text-anchor="middle">ART.94</text>
    
    <!-- Central handle indicator -->
    <circle cx="0" cy="0" r="6" fill="#c41e3a"/>
  </g>
  
  <!-- Bottom section -->
  <line x1="50" y1="520" x2="630" y2="520" stroke="#c41e3a" stroke-width="1" opacity="0.3"/>
  
  <text x="340" y="560" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#a09880" font-style="italic">
    UE atacă pe Fritz. România execută
  </text>
  <text x="340" y="585" font-family="Georgia, serif" font-size="14" text-anchor="middle" fill="#a09880" font-style="italic">
    în liniște cu articolul 94.
  </text>
  
  <!-- Logo corner bottom right -->
  <text x="650" y="660" font-family="Cinzel, serif" font-size="12" text-anchor="end" fill="#b8954a" letter-spacing="2" font-weight="600">ÆQVVS</text>
  
  <!-- Decorative corner bottom left -->
  <rect x="30" y="610" width="2" height="40" fill="#c41e3a"/>
  <rect x="30" y="648" width="40" height="2" fill="#c41e3a"/>
</svg>
